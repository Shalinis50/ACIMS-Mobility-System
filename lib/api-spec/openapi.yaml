openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: buses
    description: Bus tracking and route operations
  - name: queue
    description: Overflow queue operations
  - name: notifications
    description: Smart alert operations
  - name: campus
    description: Campus locations, stops, and routes
  - name: navigation
    description: Walking and bus navigation
  - name: safety
    description: Student safety and emergency assistance
  - name: admin
    description: Administrative transport management
  - name: ai
    description: Data-grounded mobility assistant
  - name: transport
    description: Public transport provider integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /buses:
    get:
      operationId: listBuses
      tags: [buses]
      summary: List active buses
      responses:
        "200":
          description: Active buses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bus"
  /buses/{busId}:
    get:
      operationId: getBus
      tags: [buses]
      summary: Get a bus
      parameters:
        - $ref: "#/components/parameters/BusId"
      responses:
        "200":
          description: Bus details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bus"
        "404":
          description: Bus not found
  /buses/{busId}/location:
    get:
      operationId: getBusLocation
      tags: [buses]
      summary: Get the latest bus location
      parameters:
        - $ref: "#/components/parameters/BusId"
      responses:
        "200":
          description: Latest simulated or real location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusLocation"
        "404":
          description: Bus not found
  /buses/{busId}/stops:
    get:
      operationId: listBusStops
      tags: [buses]
      summary: List stops for a bus route
      parameters:
        - $ref: "#/components/parameters/BusId"
      responses:
        "200":
          description: Bus stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusStop"
        "404":
          description: Bus not found
  /bus/location:
    post:
      operationId: updateBusLocation
      tags: [buses]
      summary: Ingest a bus location update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusLocationInput"
      responses:
        "200":
          description: Updated bus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bus"
        "400":
          description: Invalid location
        "404":
          description: Bus not found
  /buses/{busId}/occupancy:
    post:
      operationId: updateBusOccupancy
      tags: [buses]
      summary: Update occupancy for development simulation
      parameters:
        - $ref: "#/components/parameters/BusId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusOccupancyInput"
      responses:
        "200":
          description: Updated bus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bus"
        "400":
          description: Invalid occupancy
        "404":
          description: Bus not found
  /queue/status:
    get:
      operationId: getQueueStatus
      tags: [queue]
      summary: Get the demo student's queue status
      parameters:
        - $ref: "#/components/parameters/BusIdQuery"
      responses:
        "200":
          description: Queue status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
  /queue/join:
    post:
      operationId: joinQueue
      tags: [queue]
      summary: Join the overflow queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueInput"
      responses:
        "201":
          description: Queue entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        "409":
          description: Student is already in the queue
  /queue/leave:
    post:
      operationId: leaveQueue
      tags: [queue]
      summary: Leave the overflow queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueLeaveInput"
      responses:
        "200":
          description: Updated queue status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List smart alerts
      responses:
        "200":
          description: Smart alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
  /campus/locations:
    get:
      operationId: listCampusLocations
      tags: [campus]
      summary: List important campus locations
      responses:
        "200":
          description: Campus locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampusLocation"
  /campus/stops:
    get:
      operationId: listCampusStops
      tags: [campus]
      summary: List campus bus stops
      responses:
        "200":
          description: Campus stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampusStop"
  /campus/routes:
    get:
      operationId: listCampusRoutes
      tags: [campus]
      summary: List campus mobility routes
      responses:
        "200":
          description: Campus routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampusRoute"
  /navigation/destinations:
    get:
      operationId: listNavigationDestinations
      tags: [navigation]
      summary: List navigation destinations
      responses:
        "200":
          description: Navigation destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampusLocation"
  /navigation/route:
    post:
      operationId: calculateNavigationRoute
      tags: [navigation]
      summary: Calculate a campus navigation option
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigationInput"
      responses:
        "200":
          description: Navigation route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationRoute"
        "404":
          description: Destination not found
  /safety/reports:
    get:
      operationId: listSafetyReports
      tags: [safety]
      summary: List the current student's safety reports
      responses:
        "200":
          description: Safety reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyReport"
  /safety/report:
    post:
      operationId: createSafetyReport
      tags: [safety]
      summary: Report a safety concern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyReportInput"
      responses:
        "201":
          description: Safety report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyReport"
  /safety/alerts:
    get:
      operationId: listSafetyAlerts
      tags: [safety]
      summary: List active safety alerts
      responses:
        "200":
          description: Safety alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyAlert"
  /safety/emergency:
    post:
      operationId: activateEmergency
      tags: [safety]
      summary: Activate the student emergency assistance state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyInput"
      responses:
        "200":
          description: Emergency assistance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyResponse"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get the transport operations dashboard
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/buses:
    get:
      operationId: listAdminBuses
      tags: [admin]
      summary: List buses for transport management
      responses:
        "200":
          description: Managed buses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBus"
    post:
      operationId: createAdminBus
      tags: [admin]
      summary: Add a managed bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBusInput"
      responses:
        "201":
          description: Created bus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBus"
  /admin/buses/{busId}:
    patch:
      operationId: updateAdminBus
      tags: [admin]
      summary: Update a managed bus
      parameters:
        - $ref: "#/components/parameters/BusId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBusInput"
      responses:
        "200":
          description: Updated bus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBus"
        "404":
          description: Bus not found
    delete:
      operationId: deactivateAdminBus
      tags: [admin]
      summary: Deactivate a managed bus
      parameters:
        - $ref: "#/components/parameters/BusId"
      responses:
        "200":
          description: Deactivated bus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBus"
  /admin/drivers:
    get:
      operationId: listAdminDrivers
      tags: [admin]
      summary: List transport drivers
      responses:
        "200":
          description: Drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"
    post:
      operationId: createAdminDriver
      tags: [admin]
      summary: Add a driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverInput"
      responses:
        "201":
          description: Created driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
  /admin/routes:
    get:
      operationId: listAdminRoutes
      tags: [admin]
      summary: List managed routes
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRoute"
    post:
      operationId: createAdminRoute
      tags: [admin]
      summary: Create a route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRouteInput"
      responses:
        "201":
          description: Created route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoute"
  /admin/queues:
    get:
      operationId: getAdminQueues
      tags: [admin]
      summary: Monitor active queues
      responses:
        "200":
          description: Queue monitoring
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminQueue"
  /admin/safety:
    get:
      operationId: getAdminSafetyReports
      tags: [admin]
      summary: Review safety reports
      responses:
        "200":
          description: Safety reports for administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyReport"
  /ai/context:
    get:
      operationId: getAiContext
      tags: [ai]
      summary: Get current ACIMS mobility context
      responses:
        "200":
          description: ACIMS context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiContext"
  /ai/chat:
    post:
      operationId: sendAiChat
      tags: [ai]
      summary: Ask the data-grounded mobility assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
  /transport/providers:
    get:
      operationId: listTransportProviders
      tags: [transport]
      summary: List transport providers and data freshness
      responses:
        "200":
          description: Transport providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransportProvider"
  /transport/routes:
    get:
      operationId: listTransportRoutes
      tags: [transport]
      summary: List available transport routes
      responses:
        "200":
          description: Transport routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicTransportJourney"
  /transport/search:
    post:
      operationId: searchTransport
      tags: [transport]
      summary: Search mobility options between two locations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransportSearchInput"
      responses:
        "200":
          description: Mobility options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicTransportJourney"
components:
  parameters:
    BusId:
      name: busId
      in: path
      required: true
      schema:
        type: string
    BusIdQuery:
      name: busId
      in: query
      required: false
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Coordinate:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required: [latitude, longitude]
    BusStop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        sequence:
          type: integer
        minutesFromPrevious:
          type: integer
      required: [id, name, latitude, longitude, sequence, minutesFromPrevious]
    BusLocation:
      type: object
      properties:
        busId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        nextStopId:
          type: string
        nextStop:
          type: string
        etaMinutes:
          type: integer
        status:
          type: string
        updatedAt:
          type: string
          format: date-time
        source:
          type: string
      required: [busId, latitude, longitude, nextStopId, nextStop, etaMinutes, status, updatedAt, source]
    BusLocationInput:
      type: object
      properties:
        busId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timestamp:
          type: string
          format: date-time
      required: [busId, latitude, longitude]
    BusOccupancyInput:
      type: object
      properties:
        currentOccupancy:
          type: integer
          minimum: 0
      required: [currentOccupancy]
    Bus:
      type: object
      properties:
        id:
          type: string
        busNumber:
          type: string
        origin:
          type: string
        destination:
          type: string
        routeLabel:
          type: string
        capacity:
          type: integer
        currentOccupancy:
          type: integer
        currentLocation:
          $ref: "#/components/schemas/Coordinate"
        nextStop:
          type: string
        nextStopId:
          type: string
        etaMinutes:
          type: integer
        status:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, busNumber, origin, destination, routeLabel, capacity, currentOccupancy, currentLocation, nextStop, nextStopId, etaMinutes, status, updatedAt]
    QueueEntry:
      type: object
      properties:
        studentId:
          type: string
        busId:
          type: string
        boardingStop:
          type: string
        queuePosition:
          type: integer
        joinedAt:
          type: string
          format: date-time
        status:
          type: string
      required: [studentId, busId, boardingStop, queuePosition, joinedAt, status]
    QueueStatus:
      type: object
      properties:
        joined:
          type: boolean
        entry:
          type: ["object", "null"]
          $ref: "#/components/schemas/QueueEntry"
        busId:
          type: string
        currentOccupancy:
          type: integer
        capacity:
          type: integer
        seatsAvailable:
          type: integer
        estimatedAvailabilityMinutes:
          type: integer
        message:
          type: string
      required: [joined, entry, busId, currentOccupancy, capacity, seatsAvailable, estimatedAvailabilityMinutes, message]
    QueueInput:
      type: object
      properties:
        studentId:
          type: string
        busId:
          type: string
        boardingStop:
          type: string
      required: [studentId, busId, boardingStop]
    QueueLeaveInput:
      type: object
      properties:
        studentId:
          type: string
        busId:
          type: string
      required: [studentId, busId]
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
        busId:
          type: string
      required: [id, type, title, message, createdAt, read, busId]
    NotificationReadInput:
      type: object
      properties:
        id:
          type: string
      required: [id]
    CampusLocation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required: [id, name, type, description, latitude, longitude]
    CampusStop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        servingBusIds:
          type: array
          items:
            type: string
        routeNames:
          type: array
          items:
            type: string
      required: [id, name, latitude, longitude, servingBusIds, routeNames]
    CampusRoute:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        busId:
          type: string
        busNumber:
          type: string
        destination:
          type: string
        stopIds:
          type: array
          items:
            type: string
      required: [id, name, busId, busNumber, destination, stopIds]
    NavigationInput:
      type: object
      properties:
        destinationId:
          type: string
        startLatitude:
          type: number
        startLongitude:
          type: number
        mode:
          type: string
      required: [destinationId]
    NavigationRoute:
      type: object
      properties:
        start:
          $ref: "#/components/schemas/Coordinate"
        destination:
          $ref: "#/components/schemas/CampusLocation"
        mode:
          type: string
        distanceKm:
          type: number
        walkingMinutes:
          type: integer
        relevantStop:
          $ref: "#/components/schemas/CampusStop"
        busOptions:
          type: array
          items:
            $ref: "#/components/schemas/NavigationBusOption"
        routeCoordinates:
          type: array
          items:
            $ref: "#/components/schemas/Coordinate"
      required: [start, destination, mode, distanceKm, walkingMinutes, relevantStop, busOptions, routeCoordinates]
    NavigationBusOption:
      type: object
      properties:
        busId:
          type: string
        busNumber:
          type: string
        destination:
          type: string
        etaMinutes:
          type: integer
        occupancy:
          type: integer
        capacity:
          type: integer
        seatsAvailable:
          type: integer
        status:
          type: string
      required: [busId, busNumber, destination, etaMinutes, occupancy, capacity, seatsAvailable, status]
    SafetyReportInput:
      type: object
      properties:
        studentId:
          type: string
        reportType:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required: [studentId, reportType, description, latitude, longitude]
    SafetyReport:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        reportType:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        createdAt:
          type: string
          format: date-time
        status:
          type: string
      required: [id, studentId, reportType, description, latitude, longitude, createdAt, status]
    SafetyAlert:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        severity:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [id, title, message, severity, latitude, longitude, createdAt]
    EmergencyInput:
      type: object
      properties:
        studentId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        message:
          type: string
      required: [studentId, latitude, longitude, message]
    EmergencyContact:
      type: object
      properties:
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
      required: [name, relationship, phone]
    EmergencyResponse:
      type: object
      properties:
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        message:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyContact"
      required: [status, createdAt, message, contacts]
    AdminBusInput:
      type: object
      properties:
        busNumber:
          type: string
        routeId:
          type: string
        driverId:
          type: string
        capacity:
          type: integer
        active:
          type: boolean
      required: [busNumber, routeId, capacity]
    AdminBus:
      allOf:
        - $ref: "#/components/schemas/AdminBusInput"
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
          required: [id, status]
    DriverInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        active:
          type: boolean
      required: [name, phone]
    Driver:
      allOf:
        - $ref: "#/components/schemas/DriverInput"
        - type: object
          properties:
            id:
              type: string
            busId:
              type: string
            routeId:
              type: string
          required: [id]
    AdminRouteInput:
      type: object
      properties:
        name:
          type: string
        destination:
          type: string
        stopIds:
          type: array
          items:
            type: string
        active:
          type: boolean
      required: [name, destination, stopIds]
    AdminRoute:
      allOf:
        - $ref: "#/components/schemas/AdminRouteInput"
        - type: object
          properties:
            id:
              type: string
            assignedBusIds:
              type: array
              items:
                type: string
          required: [id, assignedBusIds]
    AdminQueue:
      type: object
      properties:
        busId:
          type: string
        busNumber:
          type: string
        queueSize:
          type: integer
        occupancy:
          type: integer
        capacity:
          type: integer
        status:
          type: string
